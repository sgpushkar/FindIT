# FindIT Spring Boot Configuration
server.port=8080
server.servlet.context-path=/

# SQLite Configuration
findit.db.path=data/lostfound.db
spring.datasource.url=jdbc:sqlite:data/lostfound.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Logging
logging.level.com.findit=INFO
logging.level.org.springframework.web=INFO

